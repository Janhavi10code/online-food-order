spring.application.name=food-delivery-api-h2
server.port=8080

# In-Memory H2 Database Configuration for Instant Standalone Testing
spring.datasource.url=jdbc:h2:mem:food_ordering_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration
foodorder.app.jwtSecret=OnlineFoodOrderingAppSuperSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong!
foodorder.app.jwtExpirationMs=86400000


