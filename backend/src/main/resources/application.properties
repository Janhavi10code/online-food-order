spring.application.name=food-delivery-api
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:food_ordering_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
foodorder.app.jwtSecret=OnlineFoodOrderingAppSuperSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong!
foodorder.app.jwtExpirationMs=86400000


